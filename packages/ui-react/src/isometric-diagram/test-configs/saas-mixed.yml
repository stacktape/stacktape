resources:
  web:
    type: nextjs-web
    properties:
      appDirectory: apps/web
      connectTo:
        - api
  api:
    type: web-service
    properties:
      packaging:
        type: dockerfile
        properties:
          dockerfilePath: Dockerfile
      usePrivateSubnetsWithNAT: true
      scaling:
        minInstances: 2
        maxInstances: 10
      loadBalancing:
        type: application-load-balancer
      cdn:
        enabled: true
      connectTo:
        - mainDb
        - cache
        - jobsQueue
        - uploads
        - billing
  billing:
    type: private-service
    properties:
      packaging:
        type: dockerfile
        properties:
          dockerfilePath: billing/Dockerfile
      usePrivateSubnetsWithNAT: true
      connectTo:
        - mainDb
  worker:
    type: worker-service
    properties:
      packaging:
        type: dockerfile
        properties:
          dockerfilePath: worker/Dockerfile
      usePrivateSubnetsWithNAT: true
      connectTo:
        - mainDb
        - jobsQueue
        - uploads
  mainDb:
    type: relational-database
    properties:
      credentials:
        masterUserPassword: x
      engine:
        type: aurora-postgresql
      accessibility:
        accessibilityMode: scoping-workloads-in-vpc
  cache:
    type: redis
  jobsQueue:
    type: sqs-queue
  uploads:
    type: bucket
  thumbnail:
    type: function
    properties:
      events:
        - type: s3
          properties:
            bucketArn: $ResourceParam('uploads', 'arn')
      connectTo:
        - uploads
  digest:
    type: function
    properties:
      events:
        - type: schedule
          properties:
            scheduleRate: rate(1 day)
      connectTo:
        - mainDb
      joinDefaultVpc: true
  migrate:
    type: deployment-script
    properties:
      joinDefaultVpc: true
      connectTo:
        - mainDb
  firewall:
    type: web-app-firewall
  authPool:
    type: user-auth-pool
