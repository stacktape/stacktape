# Formatter settings for `bun fmt`. dprint formats `.astro` files (`dprint.json`).
[fmt]
# Without an oxfmt config file, bun fmt starts from Prettier's style; keep oxfmt's, which the code is formatted in.
flavor = "oxfmt"
printWidth = 120
singleQuote = true
trailingComma = "none"
endOfLine = "lf"
ignorePatterns = [
  "**/*.astro",
  "**/.astro/**",
  "**/.turbo/**",
  "**/@generated/**",
  "**/coverage/**",
  "**/dist/**",
  "**/generated/**",
  "**/node_modules/**",
  "**/pnpm-lock.yaml",
  "apps/cli/starter-projects/**",
  "apps/docs/content/**",
  "packages/config/src/**"
]

[[fmt.overrides]]
files = ["**/*.md", "**/*.mdx"]
options = { proseWrap = "always" }
