name: Bug report
description: Something in Stacktape does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command you ran and the full error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest configuration and steps that show the problem. Remove secrets and account IDs.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Stacktape version
      description: Output of `stacktape version`.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Console
        - Deployed infrastructure
        - Documentation
        - VS Code extension
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and runtime
      description: For example macOS 15, Node 24, Docker Desktop 4.40.
