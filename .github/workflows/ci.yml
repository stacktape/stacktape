name: Public CI

on:
  pull_request:
  push:
    branches:
      - main
      - v4/integration

permissions:
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # The CLI's build and test scripts run under Bun; the root package.json pins the workspace version.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:public
      - name: Validate synthesized CloudFormation
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check cfn-lint==1.53.3
          template_path="$RUNNER_TEMP/stacktape-dense-application.json"
          STACKTAPE_SYNTHESIS_TEMPLATE_OUTPUT="$template_path" \
            pnpm --filter @stacktape/cli exec bun test tests/characterization/synthesis-contract.spec.ts
          cfn-lint --template "$template_path" --regions eu-west-1 --non-zero-exit-code error
