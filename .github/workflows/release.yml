name: Stacktape release
run-name: ${{ inputs.bytecode_qualification && 'Qualify bytecode for macOS and Linux ARM' || format('Publish v4 {0} {1}', inputs.channel, inputs.version) }}

# Preview and stable releases build the same verified artifacts. The selected channel changes only the npm dist-tag,
# GitHub release classification, protected publishing environment, and installer endpoint. npm and AWS authenticate
# independently with short-lived OIDC credentials; no long-lived npm, Stacktape, or AWS credential enters this workflow.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Publish an immutable preview or stable release
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable
      version:
        description: SemVer version (preview publication requires, for example, 4.0.0-preview.1)
        required: true
        type: string
      recovery_run_id:
        description: Recover assets/installers from a verified run whose npm upload succeeded (no rebuild or republish)
        required: false
        default: ''
        type: string
      bytecode_qualification:
        description: Only qualify bytecode for macOS and Linux ARM on their own runners; builds and publishes no release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: v4-release-${{ inputs.channel }}
  cancel-in-progress: false

env:
  RELEASE_OWNER: github-${{ github.run_id }}-${{ github.run_attempt }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  verify:
    if: inputs.recovery_run_id == '' && !inputs.bytecode_qualification
    name: Verify public workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - run: pnpm install --frozen-lockfile
      - name: Validate release input
        working-directory: apps/cli
        run: |
          bun scripts/release/validate-release-input.ts
          if [ "$RELEASE_CHANNEL" = stable ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Stable releases must be dispatched from main."
            exit 1
          fi
      - name: Refuse an already-used release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm_lookup=$(npm view "stacktape@$RELEASE_VERSION" version 2>&1)
          npm_status=$?
          set -e
          if [ "$npm_status" -eq 0 ]; then
            echo "stacktape@$RELEASE_VERSION already exists on npm."
            exit 1
          fi
          if ! printf '%s' "$npm_lookup" | grep -q 'E404'; then
            printf 'Could not safely establish npm version availability:\n%s\n' "$npm_lookup"
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_VERSION already exists."
            exit 1
          fi
      - run: pnpm check:public
      - name: Execute packaging artifacts in real runtimes
        run: pnpm test:packaging-e2e

  build-binaries:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            archive: linux.tar.gz
          - platform: linux-arm
            archive: linux-arm.tar.gz
          - platform: alpine
            archive: alpine.tar.gz
          - platform: macos
            archive: macos.tar.gz
          - platform: macos-arm
            archive: macos-arm.tar.gz
          - platform: win
            archive: windows.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - run: pnpm install --frozen-lockfile
      # The binary serves this from beside itself; the packaging step fails loudly without it.
      - name: Build init wizard interface
        run: pnpm turbo run build --filter=@stacktape/init-ui
      - name: Build binary archive
        working-directory: apps/cli
        run: >-
          bun scripts/build-dist-package.ts
          --platform "${{ matrix.platform }}"
          --version "$RELEASE_VERSION"
      - name: Smoke-test Alpine runtime
        if: matrix.platform == 'alpine'
        run: |
          docker run --rm --tty \
            --mount "type=bind,source=$PWD/apps/cli/__dist,target=/candidate,readonly" \
            alpine:3.22 sh -eu -c '
              apk add --no-cache libstdc++ libgcc gcompat >/dev/null
              mkdir /tmp/stacktape-candidate
              tar -xzf /candidate/alpine.tar.gz -C /tmp/stacktape-candidate
              /tmp/stacktape-candidate/stacktape --version
              /tmp/stacktape-candidate/nixpacks/nixpacks --version
              /tmp/stacktape-candidate/pack/pack version
              /tmp/stacktape-candidate/session-manager-plugin/smp --version

              tui_status=0
              tui_output=$(
                FORCE_TTY=1 STP_DISABLE_TELEMETRY=1 STP_PRINT_UNHANDLED_ERROR=1 \
                  timeout 3 /tmp/stacktape-candidate/stacktape 2>&1
              ) || tui_status=$?
              case "$tui_status" in
                124|143) ;;
                *)
                  printf "%s\n" "$tui_output"
                  printf "Interactive Alpine smoke exited unexpectedly with status %s.\n" "$tui_status"
                  exit 1
                  ;;
              esac
            '
      - name: Upload binary archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.platform }}
          path: apps/cli/__dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  # Bytecode ships only for targets qualified on their own host (`BYTECODE_PLATFORMS` in
  # apps/cli/scripts/release/build-cli-sources.ts). Dispatched with `bytecode_qualification`, this builds the remaining
  # targets' archives the way the release builds them, cross-compiled here, then runs them on their own runners. A
  # target passes when its bytecode archive is within its gate and behaves exactly like the build without bytecode
  # while starting clearly faster (apps/cli/scripts/release/qualify-bytecode.ts).
  bytecode-qualification-build:
    name: Build ${{ matrix.platform }} bytecode candidates
    if: inputs.bytecode_qualification && inputs.recovery_run_id == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, macos-arm, linux-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - run: pnpm install --frozen-lockfile
      - name: Build init wizard interface
        run: pnpm turbo run build --filter=@stacktape/init-ui
      - name: Build the archive without bytecode and at depth 1
        working-directory: apps/cli
        run: >-
          bun scripts/release/qualify-bytecode.ts build
          --platform "${{ matrix.platform }}"
          --out "$RUNNER_TEMP/bytecode-candidates"
      - name: Upload bytecode candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bytecode-candidates-${{ matrix.platform }}
          path: ${{ runner.temp }}/bytecode-candidates
          if-no-files-found: error
          retention-days: 7

  bytecode-qualification:
    name: Qualify ${{ matrix.platform }} bytecode on its own runner
    needs: bytecode-qualification-build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15-intel
          - platform: macos-arm
            runner: macos-15
          - platform: linux-arm
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - run: pnpm install --frozen-lockfile
      - name: Download bytecode candidates
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: bytecode-candidates-${{ matrix.platform }}
          path: ${{ runner.temp }}/bytecode-candidates
      - name: Compare behavior and paired startup times on this runner
        working-directory: apps/cli
        run: >-
          bun scripts/release/qualify-bytecode.ts check
          --archives "$RUNNER_TEMP/bytecode-candidates"
          --work "$RUNNER_TEMP/bytecode-check"
          --out "$RUNNER_TEMP/bytecode-qualification-${{ matrix.platform }}.json"
          --package-functions 1,10
      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bytecode-qualification-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/bytecode-candidates/build.json
            ${{ runner.temp }}/bytecode-qualification-${{ matrix.platform }}.json
          if-no-files-found: warn
          retention-days: 30

  assemble:
    name: Assemble verified candidate
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - run: pnpm install --frozen-lockfile
      - name: Download binary archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: binary-*
          path: apps/cli/__dist
          merge-multiple: true
      - name: Verify exact binary archive set
        working-directory: apps/cli
        run: bun scripts/release/verify-candidate-assets.ts
      - name: Generate archive checksums
        working-directory: apps/cli
        run: pnpm run release:checksums
      - name: Build and verify npm package
        working-directory: apps/cli
        run: |
          pnpm run build:npm --version "$RELEASE_VERSION" --require-checksums
          bun scripts/verify-npm-package.ts --require-checksums --expected-version "$RELEASE_VERSION"
          pnpm --dir ./__release-npm pack --pack-destination ../__dist
      - name: Upload complete release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stacktape-${{ inputs.version }}-candidate
          path: |
            apps/cli/__dist/*.tar.gz
            apps/cli/__dist/*.zip
            apps/cli/__dist/SHA256SUMS
            apps/cli/__dist/stacktape-*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ${{ inputs.channel }}
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - run: npm install --global npm@11.16.0
      - run: pnpm install --frozen-lockfile
      - name: Download verified candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stacktape-${{ inputs.version }}-candidate
          path: apps/cli/__dist
      - name: Revalidate protected release operation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun apps/cli/scripts/release/validate-release-input.ts
          if [ "$RELEASE_CHANNEL" = stable ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Stable releases must be dispatched from main."
            exit 1
          fi
          set +e
          npm_lookup=$(npm view "stacktape@$RELEASE_VERSION" version 2>&1)
          npm_status=$?
          set -e
          if [ "$npm_status" -eq 0 ]; then
            echo "stacktape@$RELEASE_VERSION already exists on npm."
            exit 1
          fi
          if ! printf '%s' "$npm_lookup" | grep -q 'E404'; then
            printf 'Could not safely establish npm version availability:\n%s\n' "$npm_lookup"
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_VERSION already exists."
            exit 1
          fi
      - name: Record current npm dist-tags
        id: dist-tags-before
        run: |
          tags=$(npm view stacktape dist-tags --json)
          echo "latest=$(printf '%s' "$tags" | jq -r '.latest // ""')" >> "$GITHUB_OUTPUT"
          echo "preview=$(printf '%s' "$tags" | jq -r '.preview // ""')" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release and upload exact candidate bytes
        id: create-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RELEASE_CHANNEL" = preview ]; then
            is_preview=true
            make_latest=false
            install_command="pnpm add --global stacktape@preview"
          else
            is_preview=false
            make_latest=true
            install_command="pnpm add --global stacktape@latest"
          fi
          release_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$RELEASE_VERSION" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="$RELEASE_VERSION" \
            -f body="Release from $GITHUB_SHA. Release owner: $RELEASE_OWNER. Install with: $install_command" \
            -F prerelease="$is_preview" \
            -f make_latest="$make_latest" \
            --jq .id)
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"
          gh release upload "$RELEASE_VERSION" \
            apps/cli/__dist/*.tar.gz \
            apps/cli/__dist/*.zip \
            apps/cli/__dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY"
      - name: Verify public assets and npm launcher end to end
        working-directory: apps/cli
        env:
          RELEASE_DIST_DIRECTORY: ${{ github.workspace }}/apps/cli/__dist
        run: bun scripts/release/verify-published-release.ts
      - name: Publish npm release
        id: npm-publish
        working-directory: apps/cli
        run: |
          npm_tag=$([ "$RELEASE_CHANNEL" = preview ] && printf preview || printf latest)
          npm_tarballs=(./__dist/stacktape-*.tgz)
          if [ "${#npm_tarballs[@]}" -ne 1 ] || [ ! -f "${npm_tarballs[0]}" ]; then
            printf 'Expected exactly one local npm tarball; found: %s\n' "${npm_tarballs[*]}"
            exit 1
          fi
          npm publish "${npm_tarballs[0]}" --tag "$npm_tag" --provenance --access public
      - name: Verify npm dist-tags
        env:
          LATEST_BEFORE: ${{ steps.dist-tags-before.outputs.latest }}
          PREVIEW_BEFORE: ${{ steps.dist-tags-before.outputs.preview }}
        run: |
          for attempt in $(seq 1 90); do
            tags=$(npm view stacktape dist-tags --json --prefer-online)
            latest_after=$(printf '%s' "$tags" | jq -r '.latest // ""')
            preview_after=$(printf '%s' "$tags" | jq -r '.preview // ""')
            if [ "$RELEASE_CHANNEL" = preview ]; then
              if [ "$latest_after" = "$LATEST_BEFORE" ] && [ "$preview_after" = "$RELEASE_VERSION" ]; then
                exit 0
              fi
            elif [ "$latest_after" = "$RELEASE_VERSION" ] && [ "$preview_after" = "$PREVIEW_BEFORE" ]; then
              exit 0
            fi
            printf 'npm dist-tags have not converged yet (attempt %s/90): latest=%s preview=%s\n' \
              "$attempt" "$latest_after" "$preview_after"
            sleep 10
          done
          printf 'npm dist-tags did not converge: latest=%s preview=%s\n' "$latest_after" "$preview_after"
          exit 1
      - name: Remove retryable GitHub release after pre-publish failure
        if: always() && steps.create-release.outputs.release-id != '' && steps.npm-publish.outcome == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm_lookup=$(npm view "stacktape@$RELEASE_VERSION" version 2>&1)
          npm_status=$?
          set -e
          if [ "$npm_status" -eq 0 ]; then
            echo "npm accepted the immutable version; preserving its required GitHub assets."
          elif printf '%s' "$npm_lookup" | grep -q 'E404'; then
            gh release delete "$RELEASE_VERSION" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
          else
            printf 'npm state is ambiguous; preserving GitHub assets:\n%s\n' "$npm_lookup"
            exit 1
          fi

  recover:
    name: Recover accepted npm publication
    if: inputs.recovery_run_id != '' && !inputs.bytecode_qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-publish
    permissions:
      contents: write
      actions: read
    env:
      RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - run: pnpm install --frozen-lockfile
      - name: Verify the original release run
        id: original
        run: |
          bun apps/cli/scripts/release/validate-release-input.ts
          test "$GITHUB_REF" = refs/heads/main
          printf '%s' "$RECOVERY_RUN_ID" | grep -Eq '^[0-9]+$'
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID")
          test "$(printf '%s' "$run_json" | jq -r .path)" = .github/workflows/release.yml
          test "$(printf '%s' "$run_json" | jq -r .event)" = workflow_dispatch
          test "$(printf '%s' "$run_json" | jq -r .head_branch)" = main
          source_sha=$(printf '%s' "$run_json" | jq -r .head_sha)
          printf '%s' "$source_sha" | grep -Eq '^[0-9a-f]{40}$'
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID/jobs?per_page=100")
          for job_name in 'Verify public workspace' 'Build linux' 'Build linux-arm' 'Build alpine' 'Build macos' 'Build macos-arm' 'Build win' 'Assemble verified candidate'; do
            printf '%s' "$jobs" | jq -e --arg name "$job_name" 'any(.jobs[]; .name == $name and .conclusion == "success")' >/dev/null
          done
          printf '%s' "$jobs" | jq -e --arg name "Publish $RELEASE_CHANNEL" \
            'any(.jobs[]; .name == $name and any(.steps[]; .name == "Publish npm release" and .conclusion == "success"))' >/dev/null
          echo "source-sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Download the original verified bytes
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stacktape-${{ inputs.version }}-candidate
          path: apps/cli/__dist
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
      - name: Verify npm contains the original package and still selects this version
        run: |
          npm_tag=$([ "$RELEASE_CHANNEL" = preview ] && printf preview || printf latest)
          expected_integrity="sha512-$(openssl dgst -sha512 -binary "apps/cli/__dist/stacktape-$RELEASE_VERSION.tgz" | openssl base64 -A)"
          actual_integrity=$(npm view "stacktape@$RELEASE_VERSION" dist.integrity --prefer-online)
          test "$actual_integrity" = "$expected_integrity"
          selected_version=$(npm view "stacktape" "dist-tags.$npm_tag" --prefer-online)
          test "$selected_version" = "$RELEASE_VERSION"
      - name: Restore missing GitHub assets without overwriting a release
        env:
          RECOVERY_SOURCE_SHA: ${{ steps.original.outputs.source-sha }}
        run: |
          set +e
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" 2>&1)
          lookup_status=$?
          set -e
          if [ "$lookup_status" -eq 0 ]; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_VERSION" --jq .object.sha)
            test "$tag_sha" = "$RECOVERY_SOURCE_SHA"
            echo 'Keeping the existing release; its public bytes will be verified next.'
          else
            printf '%s' "$existing" | grep -q 'HTTP 404'
            printf 'Release from %s. Recovered verified artifacts from run %s.\n' "$RECOVERY_SOURCE_SHA" "$RECOVERY_RUN_ID" > "$RUNNER_TEMP/release-recovery.md"
            if [ "$RELEASE_CHANNEL" = preview ]; then
              classification=(--prerelease --latest=false)
            else
              classification=(--latest)
            fi
            gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --target "$RECOVERY_SOURCE_SHA" \
              --title "$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-recovery.md" "${classification[@]}"
          fi
          existing_assets=$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          missing_assets=()
          for asset in apps/cli/__dist/*.tar.gz apps/cli/__dist/*.zip apps/cli/__dist/SHA256SUMS; do
            if ! printf '%s\n' "$existing_assets" | grep -Fxq "$(basename "$asset")"; then
              missing_assets+=("$asset")
            fi
          done
          if [ "${#missing_assets[@]}" -gt 0 ]; then
            gh release upload "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" "${missing_assets[@]}"
          fi
      - name: Verify recovered public assets and npm launcher
        working-directory: apps/cli
        env:
          RELEASE_DIST_DIRECTORY: ${{ github.workspace }}/apps/cli/__dist
        run: bun scripts/release/verify-published-release.ts

  publish-installers:
    name: Publish ${{ inputs.channel }} installers
    needs: [publish, recover]
    if: always() && (needs.publish.result == 'success' || needs.recover.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-installers
    permissions:
      contents: read
      id-token: write
    env:
      STACKTAPE_INSTALLS_BASE_URL: ${{ inputs.channel == 'stable' && vars.STACKTAPE_STABLE_INSTALLS_BASE_URL || vars.STACKTAPE_PREVIEW_INSTALLS_BASE_URL }}
      STACKTAPE_INSTALLS_BUCKET_NAME: ${{ inputs.channel == 'stable' && vars.STACKTAPE_STABLE_INSTALLS_BUCKET_NAME || vars.STACKTAPE_PREVIEW_INSTALLS_BUCKET_NAME }}
      STACKTAPE_INSTALLS_DISTRIBUTION_ID: ${{ inputs.channel == 'stable' && vars.STACKTAPE_STABLE_INSTALLS_DISTRIBUTION_ID || vars.STACKTAPE_PREVIEW_INSTALLS_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - run: pnpm install --frozen-lockfile
      - name: Validate installer publishing target
        env:
          AWS_ACCOUNT_ID: ${{ vars.STACKTAPE_RELEASE_AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.STACKTAPE_RELEASE_AWS_ROLE_ARN }}
        run: |
          printf '%s' "$AWS_ACCOUNT_ID" | grep -Eq '^[0-9]{12}$'
          printf '%s' "$AWS_ROLE_ARN" | grep -Eq "^arn:aws:iam::${AWS_ACCOUNT_ID}:role/.+"
          test -n "$STACKTAPE_INSTALLS_BUCKET_NAME"
          printf '%s' "$STACKTAPE_INSTALLS_DISTRIBUTION_ID" | grep -Eq '^E[A-Z0-9]+$'
          printf '%s' "$STACKTAPE_INSTALLS_BASE_URL" | grep -Eq '^https://[^/]+$'
      - name: Acquire temporary installer-publishing credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.STACKTAPE_RELEASE_AWS_ROLE_ARN }}
          role-session-name: stacktape-release-${{ github.run_id }}
          aws-region: ${{ vars.STACKTAPE_RELEASE_AWS_REGION || 'eu-west-1' }}
          allowed-account-ids: ${{ vars.STACKTAPE_RELEASE_AWS_ACCOUNT_ID }}
          role-duration-seconds: 900
      - name: Upload and verify installer assets
        working-directory: apps/cli
        run: >-
          bun scripts/publish-install-scripts.ts
          --channel "$RELEASE_CHANNEL"
          --version "$RELEASE_VERSION"

  cleanup-release-publication:
    name: Recover canceled release publication
    if: ${{ always() && needs.publish.result != 'success' && needs.publish.result != 'skipped' }}
    needs:
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-publish
    permissions:
      contents: write
      actions: read
    steps:
      - name: Remove only this run's retryable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A successful npm upload can remain invisible while npm processes it. Cancellation or an error during
          # upload is also ambiguous. Preserve assets whenever npm publication started, regardless of registry 404s.
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")
          if printf '%s' "$jobs" | jq -e --arg name "Publish $RELEASE_CHANNEL" \
            'any(.jobs[]; .name == $name and any(.steps[]; .name == "Publish npm release" and (.status == "in_progress" or (.status == "completed" and .conclusion != "skipped"))))' >/dev/null; then
            echo 'npm publication was attempted; preserving its required GitHub assets.'
            exit 0
          fi
          release_json=''
          release_lookup=''
          release_status=1
          for attempt in 1 2 3 4 5 6; do
            set +e
            release_lookup=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" 2>&1)
            release_status=$?
            set -e
            if [ "$release_status" -eq 0 ]; then
              release_json=$release_lookup
              break
            fi
            [ "$attempt" -eq 6 ] || sleep 10
          done
          if [ "$release_status" -ne 0 ]; then
            if printf '%s' "$release_lookup" | grep -q 'HTTP 404'; then
              echo "No GitHub release from this run needs cleanup."
              exit 0
            fi
            printf 'GitHub release state is ambiguous; cleanup cannot report success:\n%s\n' "$release_lookup"
            exit 1
          fi
          release_owner=$(printf '%s' "$release_json" | jq -r .body)
          if ! printf '%s' "$release_owner" | grep -Fq "Release owner: $RELEASE_OWNER."; then
            echo "The existing release is not owned by this workflow run; preserving it."
            exit 1
          fi

          npm_status=1
          npm_lookup=''
          for attempt in 1 2 3 4 5 6; do
            set +e
            npm_lookup=$(npm view "stacktape@$RELEASE_VERSION" version 2>&1)
            npm_status=$?
            set -e
            if [ "$npm_status" -eq 0 ]; then
              echo "npm accepted the immutable version; preserving its required GitHub assets."
              exit 0
            fi
            if ! printf '%s' "$npm_lookup" | grep -q 'E404'; then
              printf 'npm state is ambiguous; preserving GitHub assets:\n%s\n' "$npm_lookup"
              exit 1
            fi
            [ "$attempt" -eq 6 ] || sleep 10
          done
          gh release delete "$RELEASE_VERSION" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
