name: v4 release candidate
run-name: Build v4 release candidate ${{ inputs.version }}

# This workflow deliberately stops at an inspectable release candidate. Keeping the release.yml filename preserves
# the npm trusted-publisher identity, but publishing remains disabled until the remaining v4 release blockers are
# resolved and a separately reviewed, protected publishing stage is added.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (for example, 4.0.0-beta.1)
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  verify:
    name: Verify public workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - run: pnpm install --frozen-lockfile
      - name: Validate candidate version
        working-directory: apps/cli
        run: >-
          node --input-type=module --eval
          "import { valid } from 'semver';
          if (!valid(process.env.RELEASE_VERSION)) throw new Error('version must be valid SemVer');"
      - run: pnpm check:public

  build-binaries:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            archive: linux.tar.gz
          - platform: linux-arm
            archive: linux-arm.tar.gz
          - platform: alpine
            archive: alpine.tar.gz
          - platform: macos
            archive: macos.tar.gz
          - platform: macos-arm
            archive: macos-arm.tar.gz
          - platform: win
            archive: windows.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - run: pnpm install --frozen-lockfile
      - name: Build binary archive
        working-directory: apps/cli
        run: >-
          bun scripts/build-dist-package.ts
          --platform "${{ matrix.platform }}"
          --version "$RELEASE_VERSION"
      - name: Upload binary archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.platform }}
          path: apps/cli/__dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble verified candidate
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - run: pnpm install --frozen-lockfile
      - name: Download binary archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: binary-*
          path: apps/cli/__dist
          merge-multiple: true
      - name: Verify exact binary archive set
        working-directory: apps/cli
        run: bun scripts/release/verify-candidate-assets.ts
      - name: Generate archive checksums
        working-directory: apps/cli
        run: pnpm run release:checksums
      - name: Build and verify npm package
        working-directory: apps/cli
        run: |
          pnpm run build:npm --version "$RELEASE_VERSION" --require-checksums
          bun scripts/verify-npm-package.ts --require-checksums --expected-version "$RELEASE_VERSION"
          npm pack ./__release-npm --pack-destination __dist
      - name: Upload complete release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stacktape-${{ inputs.version }}-candidate
          path: |
            apps/cli/__dist/*.tar.gz
            apps/cli/__dist/*.zip
            apps/cli/__dist/SHA256SUMS
            apps/cli/__dist/stacktape-*.tgz
          if-no-files-found: error
          retention-days: 14
