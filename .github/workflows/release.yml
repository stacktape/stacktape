name: Stacktape release
run-name: Publish v4 ${{ inputs.channel }} ${{ inputs.version }}

# Preview and stable releases build the same verified artifacts. The selected channel changes only the npm dist-tag,
# GitHub release classification, protected publishing environment, and installer endpoint. npm and AWS authenticate
# independently with short-lived OIDC credentials; no long-lived npm, Stacktape, or AWS credential enters this workflow.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Publish an immutable preview or stable release
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable
      version:
        description: SemVer version (preview publication requires, for example, 4.0.0-preview.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v4-release-${{ inputs.channel }}
  cancel-in-progress: false

env:
  RELEASE_OWNER: github-${{ github.run_id }}-${{ github.run_attempt }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  verify:
    name: Verify public workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - name: Validate release input
        working-directory: apps/cli
        run: |
          bun scripts/release/validate-release-input.ts
          if [ "$RELEASE_CHANNEL" = stable ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Stable releases must be dispatched from main."
            exit 1
          fi
      - name: Refuse an already-used release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm_lookup=$(npm view "stacktape@$RELEASE_VERSION" version 2>&1)
          npm_status=$?
          set -e
          if [ "$npm_status" -eq 0 ]; then
            echo "stacktape@$RELEASE_VERSION already exists on npm."
            exit 1
          fi
          if ! printf '%s' "$npm_lookup" | grep -q 'E404'; then
            printf 'Could not safely establish npm version availability:\n%s\n' "$npm_lookup"
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_VERSION already exists."
            exit 1
          fi
      - run: pnpm check:public

  build-binaries:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            archive: linux.tar.gz
          - platform: linux-arm
            archive: linux-arm.tar.gz
          - platform: alpine
            archive: alpine.tar.gz
          - platform: macos
            archive: macos.tar.gz
          - platform: macos-arm
            archive: macos-arm.tar.gz
          - platform: win
            archive: windows.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      # The binary serves this from beside itself; the packaging step fails loudly without it.
      - name: Build init wizard interface
        run: pnpm turbo run build --filter=@stacktape/init-ui
      - name: Build binary archive
        working-directory: apps/cli
        run: >-
          bun scripts/build-dist-package.ts
          --platform "${{ matrix.platform }}"
          --version "$RELEASE_VERSION"
      - name: Smoke-test Alpine runtime
        if: matrix.platform == 'alpine'
        run: |
          docker run --rm --tty \
            --mount "type=bind,source=$PWD/apps/cli/__dist,target=/candidate,readonly" \
            alpine:3.22 sh -eu -c '
              apk add --no-cache libstdc++ libgcc gcompat >/dev/null
              mkdir /tmp/stacktape-candidate
              tar -xzf /candidate/alpine.tar.gz -C /tmp/stacktape-candidate
              /tmp/stacktape-candidate/stacktape --version
              /tmp/stacktape-candidate/nixpacks/nixpacks --version
              /tmp/stacktape-candidate/pack/pack version
              /tmp/stacktape-candidate/session-manager-plugin/smp --version

              tui_status=0
              tui_output=$(
                FORCE_TTY=1 STP_DISABLE_TELEMETRY=1 STP_PRINT_UNHANDLED_ERROR=1 \
                  timeout 3 /tmp/stacktape-candidate/stacktape 2>&1
              ) || tui_status=$?
              case "$tui_status" in
                124|143) ;;
                *)
                  printf "%s\n" "$tui_output"
                  printf "Interactive Alpine smoke exited unexpectedly with status %s.\n" "$tui_status"
                  exit 1
                  ;;
              esac
            '
      - name: Upload binary archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.platform }}
          path: apps/cli/__dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble verified candidate
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - name: Download binary archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: binary-*
          path: apps/cli/__dist
          merge-multiple: true
      - name: Verify exact binary archive set
        working-directory: apps/cli
        run: bun scripts/release/verify-candidate-assets.ts
      - name: Generate archive checksums
        working-directory: apps/cli
        run: pnpm run release:checksums
      - name: Build and verify npm package
        working-directory: apps/cli
        run: |
          pnpm run build:npm --version "$RELEASE_VERSION" --require-checksums
          bun scripts/verify-npm-package.ts --require-checksums --expected-version "$RELEASE_VERSION"
          pnpm --dir ./__release-npm pack --pack-destination ../__dist
      - name: Upload complete release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stacktape-${{ inputs.version }}-candidate
          path: |
            apps/cli/__dist/*.tar.gz
            apps/cli/__dist/*.zip
            apps/cli/__dist/SHA256SUMS
            apps/cli/__dist/stacktape-*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ${{ inputs.channel }}
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: npm install --global npm@11.16.0
      - run: pnpm install --frozen-lockfile
      - name: Download verified candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: stacktape-${{ inputs.version }}-candidate
          path: apps/cli/__dist
      - name: Revalidate protected release operation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun apps/cli/scripts/release/validate-release-input.ts
          if [ "$RELEASE_CHANNEL" = stable ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Stable releases must be dispatched from main."
            exit 1
          fi
          set +e
          npm_lookup=$(npm view "stacktape@$RELEASE_VERSION" version 2>&1)
          npm_status=$?
          set -e
          if [ "$npm_status" -eq 0 ]; then
            echo "stacktape@$RELEASE_VERSION already exists on npm."
            exit 1
          fi
          if ! printf '%s' "$npm_lookup" | grep -q 'E404'; then
            printf 'Could not safely establish npm version availability:\n%s\n' "$npm_lookup"
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_VERSION already exists."
            exit 1
          fi
      - name: Record current npm dist-tags
        id: dist-tags-before
        run: |
          tags=$(npm view stacktape dist-tags --json)
          echo "latest=$(printf '%s' "$tags" | jq -r '.latest // ""')" >> "$GITHUB_OUTPUT"
          echo "preview=$(printf '%s' "$tags" | jq -r '.preview // ""')" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release and upload exact candidate bytes
        id: create-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RELEASE_CHANNEL" = preview ]; then
            is_preview=true
            make_latest=false
            install_command="pnpm add --global stacktape@preview"
          else
            is_preview=false
            make_latest=true
            install_command="pnpm add --global stacktape@latest"
          fi
          release_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$RELEASE_VERSION" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="$RELEASE_VERSION" \
            -f body="Release from $GITHUB_SHA. Release owner: $RELEASE_OWNER. Install with: $install_command" \
            -F prerelease="$is_preview" \
            -f make_latest="$make_latest" \
            --jq .id)
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"
          gh release upload "$RELEASE_VERSION" \
            apps/cli/__dist/*.tar.gz \
            apps/cli/__dist/*.zip \
            apps/cli/__dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY"
      - name: Verify public assets and npm launcher end to end
        working-directory: apps/cli
        env:
          RELEASE_DIST_DIRECTORY: ${{ github.workspace }}/apps/cli/__dist
        run: bun scripts/release/verify-published-release.ts
      - name: Publish npm release
        id: npm-publish
        working-directory: apps/cli
        run: |
          npm_tag=$([ "$RELEASE_CHANNEL" = preview ] && printf preview || printf latest)
          npm_tarballs=(./__dist/stacktape-*.tgz)
          if [ "${#npm_tarballs[@]}" -ne 1 ] || [ ! -f "${npm_tarballs[0]}" ]; then
            printf 'Expected exactly one local npm tarball; found: %s\n' "${npm_tarballs[*]}"
            exit 1
          fi
          npm publish "${npm_tarballs[0]}" --tag "$npm_tag" --provenance --access public
      - name: Verify npm dist-tags
        env:
          LATEST_BEFORE: ${{ steps.dist-tags-before.outputs.latest }}
          PREVIEW_BEFORE: ${{ steps.dist-tags-before.outputs.preview }}
        run: |
          for attempt in $(seq 1 12); do
            tags=$(npm view stacktape dist-tags --json --prefer-online)
            latest_after=$(printf '%s' "$tags" | jq -r '.latest // ""')
            preview_after=$(printf '%s' "$tags" | jq -r '.preview // ""')
            if [ "$RELEASE_CHANNEL" = preview ]; then
              if [ "$latest_after" = "$LATEST_BEFORE" ] && [ "$preview_after" = "$RELEASE_VERSION" ]; then
                exit 0
              fi
            elif [ "$latest_after" = "$RELEASE_VERSION" ] && [ "$preview_after" = "$PREVIEW_BEFORE" ]; then
              exit 0
            fi
            printf 'npm dist-tags have not converged yet (attempt %s/12): latest=%s preview=%s\n' \
              "$attempt" "$latest_after" "$preview_after"
            sleep 10
          done
          printf 'npm dist-tags did not converge: latest=%s preview=%s\n' "$latest_after" "$preview_after"
          exit 1
      - name: Remove retryable GitHub release after pre-publish failure
        if: always() && steps.create-release.outputs.release-id != '' && steps.npm-publish.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm_lookup=$(npm view "stacktape@$RELEASE_VERSION" version 2>&1)
          npm_status=$?
          set -e
          if [ "$npm_status" -eq 0 ]; then
            echo "npm accepted the immutable version; preserving its required GitHub assets."
          elif printf '%s' "$npm_lookup" | grep -q 'E404'; then
            gh release delete "$RELEASE_VERSION" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
          else
            printf 'npm state is ambiguous; preserving GitHub assets:\n%s\n' "$npm_lookup"
            exit 1
          fi

  publish-installers:
    name: Publish ${{ inputs.channel }} installers
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-installers
    permissions:
      contents: read
      id-token: write
    env:
      STACKTAPE_INSTALLS_BASE_URL: ${{ inputs.channel == 'stable' && vars.STACKTAPE_STABLE_INSTALLS_BASE_URL || vars.STACKTAPE_PREVIEW_INSTALLS_BASE_URL }}
      STACKTAPE_INSTALLS_BUCKET_NAME: ${{ inputs.channel == 'stable' && vars.STACKTAPE_STABLE_INSTALLS_BUCKET_NAME || vars.STACKTAPE_PREVIEW_INSTALLS_BUCKET_NAME }}
      STACKTAPE_INSTALLS_DISTRIBUTION_ID: ${{ inputs.channel == 'stable' && vars.STACKTAPE_STABLE_INSTALLS_DISTRIBUTION_ID || vars.STACKTAPE_PREVIEW_INSTALLS_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - name: Validate installer publishing target
        env:
          AWS_ACCOUNT_ID: ${{ vars.STACKTAPE_RELEASE_AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.STACKTAPE_RELEASE_AWS_ROLE_ARN }}
        run: |
          printf '%s' "$AWS_ACCOUNT_ID" | grep -Eq '^[0-9]{12}$'
          printf '%s' "$AWS_ROLE_ARN" | grep -Eq "^arn:aws:iam::${AWS_ACCOUNT_ID}:role/.+"
          test -n "$STACKTAPE_INSTALLS_BUCKET_NAME"
          printf '%s' "$STACKTAPE_INSTALLS_DISTRIBUTION_ID" | grep -Eq '^E[A-Z0-9]+$'
          printf '%s' "$STACKTAPE_INSTALLS_BASE_URL" | grep -Eq '^https://[^/]+$'
      - name: Acquire temporary installer-publishing credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.STACKTAPE_RELEASE_AWS_ROLE_ARN }}
          role-session-name: stacktape-release-${{ github.run_id }}
          aws-region: ${{ vars.STACKTAPE_RELEASE_AWS_REGION || 'eu-west-1' }}
          allowed-account-ids: ${{ vars.STACKTAPE_RELEASE_AWS_ACCOUNT_ID }}
          role-duration-seconds: 900
      - name: Upload and verify installer assets
        working-directory: apps/cli
        run: >-
          bun scripts/publish-install-scripts.ts
          --channel "$RELEASE_CHANNEL"
          --version "$RELEASE_VERSION"

  cleanup-release-publication:
    name: Recover canceled release publication
    if: ${{ always() && needs.publish.result != 'success' }}
    needs:
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-publish
    permissions:
      contents: write
    steps:
      - name: Remove only this run's retryable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json=''
          release_lookup=''
          release_status=1
          for attempt in 1 2 3 4 5 6; do
            set +e
            release_lookup=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" 2>&1)
            release_status=$?
            set -e
            if [ "$release_status" -eq 0 ]; then
              release_json=$release_lookup
              break
            fi
            [ "$attempt" -eq 6 ] || sleep 10
          done
          if [ "$release_status" -ne 0 ]; then
            if printf '%s' "$release_lookup" | grep -q 'HTTP 404'; then
              echo "No GitHub release from this run needs cleanup."
              exit 0
            fi
            printf 'GitHub release state is ambiguous; cleanup cannot report success:\n%s\n' "$release_lookup"
            exit 1
          fi
          release_owner=$(printf '%s' "$release_json" | jq -r .body)
          if ! printf '%s' "$release_owner" | grep -Fq "Release owner: $RELEASE_OWNER."; then
            echo "The existing release is not owned by this workflow run; preserving it."
            exit 1
          fi

          npm_status=1
          npm_lookup=''
          for attempt in 1 2 3 4 5 6; do
            set +e
            npm_lookup=$(npm view "stacktape@$RELEASE_VERSION" version 2>&1)
            npm_status=$?
            set -e
            if [ "$npm_status" -eq 0 ]; then
              echo "npm accepted the immutable version; preserving its required GitHub assets."
              exit 0
            fi
            if ! printf '%s' "$npm_lookup" | grep -q 'E404'; then
              printf 'npm state is ambiguous; preserving GitHub assets:\n%s\n' "$npm_lookup"
              exit 1
            fi
            [ "$attempt" -eq 6 ] || sleep 10
          done
          gh release delete "$RELEASE_VERSION" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
