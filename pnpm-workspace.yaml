packages:
  - apps/cli
  - apps/docs
  - apps/init-ui
  - apps/vscode-extension
  - apps/website
  # Named rather than globbed: the console also holds non-package folders (documents/), and a glob
  # would demand a package.json of every one of them. Both paths are simply absent in a public-only
  # checkout, which pnpm and sherif already tolerate.
  - apps/console/api
  - apps/console/ui
  - packages/*

autoInstallPeers: false
engineStrict: true
nodeLinker: isolated
pmOnFail: download
# The CLI compiles release binaries for glibc and musl Linux from the same checkout, so both libc variants of
# platform-specific optional dependencies (@opentui/core-linux-*) have to be installed.
supportedArchitectures:
  libc:
    - current
    - glibc
    - musl
savePrefix: ''
sharedWorkspaceLockfile: false
strictPeerDependencies: true

catalog:
  '@ast-grep/cli': 0.44.1
  '@astrojs/check': 0.9.9
  '@types/bun': 1.4.0
  '@tanstack/react-query': 5.102.8
  '@trpc/client': 11.18.0
  '@trpc/server': 11.18.0
  '@trpc/tanstack-react-query': 11.18.0
  '@types/node': 26.4.0
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  astro: 7.1.3
  dependency-cruiser: 18.1.0
  dprint: 0.55.2
  esbuild: 0.28.1
  jscpd: 5.0.12
  knip: 6.29.0
  lint-staged: 16.1.2
  oxfmt: 0.60.0
  oxlint: 1.75.0
  publint: 0.3.22
  react: 19.2.8
  react-dom: 19.2.8
  sherif: 1.13.0
  turbo: 2.10.6
  tsx: 4.23.12
  typescript: 6.0.3
  zod: 4.5.4

minimumReleaseAgeExclude:
  - stacktape@4.0.0-preview.8
  - zod@4.5.4
