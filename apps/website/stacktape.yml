# The marketing site: a static Astro build served from a bucket behind a CDN.
#
# `pnpm deploy:web` and `pnpm deploy:web:preview` from the repository root build
# the public site, upload `dist` and invalidate the CDN. The domains come from
# `directives.ts`: `stacktape.com` + `www` for the production stage, `<stage>-web.stacktape.com`
# for every other stage.
directives:
  - name: getWebDomains
    filePath: directives.ts:getWebDomains
  - name: getWebBuildCommand
    filePath: directives.ts:getWebBuildCommand
  - name: redirectFunctionCode
    filePath: src/build/redirects.ts:redirectFunctionCode

scripts:
  build:
    type: local-script
    properties:
      executeCommand: $getWebBuildCommand($Stage())

hooks:
  beforeDeploy:
    - scriptName: build

resources:
  webBucket:
    type: bucket
    properties:
      directoryUpload:
        directoryPath: dist
        headersPreset: static-website
      cdn:
        enabled: true
        errorDocument: /404.html
        customDomains: $getWebDomains($Stage())

    overrides:
      WebBucketCdnDistribution0:
        DistributionConfig.DefaultCacheBehavior.FunctionAssociations:
          - EventType: viewer-request
            FunctionARN: $CfResourceParam('WebRedirectsFunction', 'FunctionARN')

cloudformationResources:
  WebRedirectsFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: $Format('web-{}-redirects', $Stage())
      AutoPublish: true
      FunctionConfig:
        Comment: Redirects old website URLs
        Runtime: cloudfront-js-2.0
      FunctionCode: $redirectFunctionCode()
