resources:
  mainApiGateway:
    type: http-api-gateway
    properties:
      cors:
        enabled: true

  redis:
    type: redis
    properties:
      defaultUserPassword: $Secret('redis.password')
      engine:
        type: valkey-serverless

  storeKeyValuePair:
    type: function
    properties:
      packaging:
        type: js-bundle
        properties:
          entryfilePath: ./src/store-key-value-pair.ts
      joinDefaultVpc: true
      connectTo:
        - redis
      events:
        - type: http-api-gateway
          properties:
            httpApiGatewayName: mainApiGateway
            method: GET
            path: /save/{key}/{value}
