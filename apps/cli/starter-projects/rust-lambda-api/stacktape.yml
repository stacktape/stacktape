resources:
  apiGateway:
    type: http-api-gateway
    properties:
      cors:
        enabled: true

  api:
    type: function
    properties:
      packaging:
        type: buildpack
        properties:
          entryfilePath: src/main.rs
      memory: 256
      runtime: provided.al2023
      architecture: x86_64
      events:
        - type: http-api-gateway
          properties:
            httpApiGatewayName: apiGateway
            path: /
            method: '*'
        - type: http-api-gateway
          properties:
            httpApiGatewayName: apiGateway
            path: /{proxy+}
            method: '*'
