resources:
  mainApiGateway:
    type: http-api-gateway

  scrapeLinks:
    type: function
    properties:
      packaging:
        type: js-bundle
        properties:
          entryfilePath: src/scrape-links.ts
          excludeDependencies:
            - puppeteer
          disableSourceMaps: true
      events:
        - type: http-api-gateway
          properties:
            httpApiGatewayName: mainApiGateway
            path: /scrape-links/{url}
            method: GET
