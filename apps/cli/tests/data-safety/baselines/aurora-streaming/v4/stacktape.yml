# Stacktape v4 equivalent of ../v3/stacktape.yml (packaging renamed per the upgrade guide).
resources:
  processor:
    type: function
    properties:
      runtime: python3.12
      packaging:
        type: buildpack
        properties:
          entryfilePath: ./src/process.py
      events:
        - type: kinesis-stream
          properties:
            kinesisStreamName: events
            batchSize: 100
      connectTo:
        - aurora
        - events
        - search
  aurora:
    type: relational-database
    properties:
      credentials:
        masterUserName: admin_user
        masterUserPassword: not-a-real-password-1
      engine:
        type: aurora-postgresql-serverless-v2
        properties:
          version: '16.10'
          minCapacity: 0.5
          maxCapacity: 2
  events:
    type: kinesis-stream
    properties:
      shardCount: 1
  search:
    type: open-search-domain
    properties:
      clusterConfig:
        instanceType: t3.small.search
        instanceCount: 1
