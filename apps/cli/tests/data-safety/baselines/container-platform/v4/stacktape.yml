# Stacktape v4 equivalent of ../v3/stacktape.yml (packaging renamed per the upgrade guide).
resources:
  web:
    type: web-service
    properties:
      packaging:
        type: js-bundle
        properties:
          entryfilePath: ./src/web.ts
      resources:
        cpu: 0.25
        memory: 512
      connectTo:
        - postgres
        - cache
        - uploads
  worker:
    type: worker-service
    properties:
      packaging:
        type: js-bundle
        properties:
          entryfilePath: ./src/worker.ts
      resources:
        cpu: 0.25
        memory: 512
      connectTo:
        - postgres
        - cache
  postgres:
    type: relational-database
    properties:
      credentials:
        masterUserName: admin_user
        masterUserPassword: not-a-real-password-1
      engine:
        type: postgres
        properties:
          version: '16.9'
          primaryInstance:
            instanceSize: db.t4g.micro
  cache:
    type: redis-cluster
    properties:
      instanceSize: cache.t4g.micro
      defaultUserPassword: not-a-real-password-2
  shared:
    type: efs-filesystem
  uploads:
    type: bucket
  site:
    type: hosting-bucket
    properties:
      uploadDirectoryPath: ./src
      hostingContentType: static-website
