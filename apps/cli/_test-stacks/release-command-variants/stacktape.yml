# Sample app for `scripts/real-aws/release-command-canary.ts`: the variants of a release command that need no database.
#
# The commands print a marker, so the canary can see that each one ran. They run in the order of the resources here.
stackConfig:
  tags:
    - name: stacktape-canary-owner
      value: local

resources:
  ec2app:
    type: worker-service
    properties:
      packaging:
        type: prebuilt-image
        properties:
          image: public.ecr.aws/docker/library/alpine:3.20
          command:
            - sleep
            - '86400'
      resources:
        instanceTypes:
          - t3.small
        cpu: 0.25
        memory: 512
      releaseCommand:
        command: echo variant-ec2
        runWhenChanged:
          - ec2.txt

  multi:
    type: multi-container-workload
    properties:
      resources:
        cpu: 0.25
        memory: 512
      scaling:
        minInstances: 1
        maxInstances: 1
      releaseCommand:
        command: wget -q -O - http://127.0.0.1:8080/ && echo variant-multi
        container: migrator
        runWhenChanged:
          - multi.txt
      containers:
        - name: proxy
          essential: false
          packaging:
            type: prebuilt-image
            properties:
              image: public.ecr.aws/docker/library/busybox:1.36
              command:
                - sh
                - -c
                - mkdir -p /www && echo proxy-is-up > /www/index.html && httpd -f -p 8080 -h /www
        - name: migrator
          dependsOn:
            - containerName: proxy
              condition: START
          packaging:
            type: prebuilt-image
            properties:
              image: public.ecr.aws/docker/library/busybox:1.36
              command:
                - sleep
                - '86400'
        - name: server
          packaging:
            type: prebuilt-image
            properties:
              image: public.ecr.aws/docker/library/busybox:1.36
              command:
                - sleep
                - '86400'

  bundle:
    type: web-service
    properties:
      packaging:
        type: js-bundle
        properties:
          entryfilePath: ./bundle/server.ts
      resources:
        cpu: 0.25
        memory: 512
      # `cowsay` is only in devDependencies, and a bundle has neither it nor this folder.
      releaseCommand:
        command: ls bundle-migrations && npx --no-install cowsay variant-bundle
        runWhenChanged:
          - bundle-migrations
