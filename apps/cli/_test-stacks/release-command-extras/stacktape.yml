# Sample app for `scripts/real-aws/release-command-canary.ts`: a Python service with code swap and a blue/green service.
#
# Each command prints a marker and the files in its `migrations` folder. It sleeps when the folder has `slow.txt` and
# fails when the folder has `fail.txt`.
stackConfig:
  tags:
    - name: stacktape-canary-owner
      value: local
  outputs:
    - name: pyUrl
      value: $ResourceParam('pyswap', 'url')
    - name: bgUrl
      value: $ResourceParam('bluegreen', 'url')

resources:
  pyswap:
    type: web-service
    properties:
      packaging:
        type: buildpack
        properties:
          sourceDirectoryPath: ./py
      resources:
        cpu: 0.25
        memory: 1024
      scaling:
        minInstances: 1
        maxInstances: 1
      codeSwap: true
      releaseCommand:
        command: python migrate.py
        runWhenChanged:
          - py/migrations

  bluegreen:
    type: web-service
    properties:
      packaging:
        type: dockerfile
        properties:
          buildContextPath: ./bg
          dockerfilePath: Dockerfile
      resources:
        cpu: 0.25
        memory: 512
      scaling:
        minInstances: 1
        maxInstances: 1
      loadBalancing:
        type: application-load-balancer
      deployment:
        strategy: AllAtOnce
      releaseCommand:
        command: node migrate.mjs
        runWhenChanged:
          - bg/migrations
